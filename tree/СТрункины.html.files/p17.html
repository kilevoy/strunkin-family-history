			<g id="g0">
				<g id="g1">
					<text id="t0" class="s4" x="0" y="19">Стрункин Иван Меркурьевич</text>
				</g>
				<g id="g2" transform="translate(0,25)">
					<text id="t1" class="s6" x="0" y="16">(Около 1886 – 31.07.1964)</text>
				</g>
				<g id="g3" transform="translate(0,55)">
					<text id="t2" class="s8" x="0" y="13">Продолжительность жизни: Около 78</text>
					<text id="t3" class="s8" x="0" y="31">Родной брат Василия Меркурьевича Стрункина. Родился ок. 1886 г., умер 31 июля 1964 г. «Дед Иван с</text>
					<text id="t4" class="s8" x="0" y="49">бородой». Похоронен на кладбище с. Речного рядом с женой Клавдией Артемьевной. Точные даты жизни и</text>
					<text id="t5" class="s8" x="0" y="67">состав детей Меркурия подтверждены его внучкой (опрос 26.10.2026).</text>
				</g>
				<g id="g4" transform="translate(0,141)">
					<text id="t6" class="s8" x="0" y="13">Ссылки на источники:</text>
					<text id="t7" class="s8" x="0" y="31">[1]</text>
					<text id="t8" class="s8" x="0" y="49">[2]</text>
				</g>
				<g id="g5" transform="translate(0,209)">
					<g id="g6">
						<text id="t9" class="s8" x="0" y="13">Отец:</text>
						<text id="t10" class="s9 po" x="37" y="13" data-link="p7.html">Стрункин Меркурий Филиппович (Около 1869 – ?)</text>
						<text id="t11" class="s8" x="0" y="31">Мать:</text>
						<text id="t12" class="s9 po" x="37" y="31" data-link="p8.html">Стрункина Мария Тимофеевна (Около 1865 – ?)</text>
						<text id="t13" class="s8" x="0" y="49">Брат:</text>
						<text id="t14" class="s9 po" x="36" y="49" data-link="p9.html">Стрункин Феодот Меркурьевич (Около 1878 – ?)</text>
						<text id="t15" class="s8" x="0" y="67">Сестра:</text>
						<text id="t16" class="s9 po" x="50" y="67" data-link="p20.html">Стрункина Пелагия Меркуриевна (Около 1881 – ?)</text>
						<text id="t17" class="s8" x="0" y="85">Сестра:</text>
						<text id="t18" class="s9 po" x="50" y="85" data-link="p27.html">Стрункина Авдотья (Евдокия) Меркуриевна (Около 1888 – ?)</text>
						<text id="t19" class="s8" x="0" y="103">Брат:</text>
						<text id="t20" class="s9 po" x="36" y="103" data-link="p19.html">Стрункин Игнатий Меркульевич (1892 – 14.02.1957)</text>
						<text id="t21" class="s8" x="0" y="121">Брат:</text>
						<text id="t22" class="s9 po" x="36" y="121" data-link="p3.html">Стрункин Василий Меркурьевич (28.01.1900 – 06.02.1942)</text>
						<text id="t23" class="s8" x="0" y="139">Брат:</text>
						<text id="t24" class="s9 po" x="36" y="139" data-link="p26.html">Стрункин Михаил Меркурьевич</text>
						<text id="t25" class="s8" x="0" y="157">Брат:</text>
						<text id="t26" class="s9 po" x="36" y="157" data-link="p63.html">Стрункин Иосиф Меркурьевич</text>
						<text id="t27" class="s8" x="0" y="175">Мать ребёнка:</text>
						<text id="t28" class="s9 po" x="90" y="175" data-link="p18.html">Стрункина Клавдия Артемьевна (Около 1890 – ?)</text>
						<text id="t29" class="s8" x="0" y="193">    Дочь:</text>
						<text id="t30" class="s9 po" x="51" y="193" data-link="p67.html">Стрункина Анна Ивановна (11.11.1911)</text>
					</g>
				</g>
				<g id="g7" transform="translate(0,421)">
					<g id="g11" transform="translate(1,0)">
						<text id="t34" class="s10" x="0" y="13">Около 1886</text>
					</g>
					<g id="g12" transform="translate(84,0)">
						<text id="t35" class="s8" x="0" y="13">Родился</text>
						<text id="t36" class="s8" x="52" y="13">. Отец:</text>
						<text id="t37" class="s9 po" x="97" y="13" data-link="p7.html">Стрункин Меркурий Филиппович (Около 1869 – ?)</text>
						<text id="t38" class="s8" x="398" y="13">. Мать:</text>
						<text id="t39" class="s9 po" x="444" y="13" data-link="p8.html">Стрункина Мария</text>
						<text id="t40" class="s9 po" x="0" y="31" data-link="p8.html">Тимофеевна (Около 1865 – ?)</text>
						<text id="t41" class="s8" x="182" y="31">. Место:</text>
						<text id="t42" class="s8" x="234" y="31">дер. Речная</text>
						<text id="t43" class="s8" x="307" y="31">.</text>
					</g>
					<path id="l0" class="s1" d="M0 38h673" />
					<g id="g13" transform="translate(9,41)">
						<text id="t44" class="s10" x="0" y="13">11.11.1911</text>
					</g>
					<g id="g14" transform="translate(84,41)">
						<text id="t45" class="s8" x="0" y="13">Родилась дочь</text>
						<text id="t46" class="s8" x="91" y="13">:</text>
						<text id="t47" class="s9 po" x="98" y="13" data-link="p67.html">Стрункина Анна Ивановна</text>
						<text id="t48" class="s8" x="258" y="13">. Мать:</text>
						<text id="t49" class="s9 po" x="304" y="13" data-link="p18.html">Стрункина Клавдия Артемьевна (Около 1890 –</text>
						<text id="t50" class="s9 po" x="0" y="31" data-link="p18.html">?)</text>
						<text id="t51" class="s8" x="12" y="31">. Место:</text>
						<text id="t52" class="s8" x="64" y="31">Оренбургская губ.</text>
						<text id="t53" class="s8" x="178" y="31">[3].</text>
					</g>
					<path id="l1" class="s1" d="M0 79h673" />
					<g id="g15" transform="translate(9,82)">
						<text id="t54" class="s10" x="0" y="13">31.07.1964</text>
					</g>
					<g id="g16" transform="translate(84,82)">
						<text id="t55" class="s8" x="0" y="13">Умер</text>

						<text id="t57" class="s8" x="84" y="13">с. Речное</text>
						<text id="t58" class="s8" x="142" y="13">.</text>
					</g>
				</g>
				<g id="g17" transform="translate(0,535)">
					<text id="t59" class="s8" x="0" y="13">Источники:</text>
					<text id="t60" class="s8" x="0" y="31">1.</text>
					<text id="t61" class="s8" x="14" y="31">Памятники и эмалированные портреты кладбища с. Речного (ОГАЧО / Фотоархив, 54.613889° N, 63.972500°</text>
					<text id="t62" class="s8" x="0" y="49">E). Стрункин Иван Меркурьевич и Клавдия Артемьевна; Стрункин Игнатий Меркульевич (1892 - 14.02.1957).</text>
					<text id="t63" class="s8" x="0" y="67">Тип: Книга или рукопись.</text>
					<text id="t64" class="s8" x="0" y="85">2.</text>
					<text id="t65" class="s8" x="14" y="85">Устное свидетельство внучки Ивана Меркурьевича Стрункина (телефонный опрос 26.10.2026): точные даты</text>
					<text id="t66" class="s8" x="0" y="103">жизни деда Ивана с бородой (ок. 1886 - 31.07.1964), состав детей Меркурия (сыновья Иван, Федот, Михаил,</text>
					<text id="t67" class="s8" x="0" y="121">Василий, Игнатий и дочь Авдотья).</text>
					<text id="t68" class="s8" x="216" y="121">Тип: Книга или рукопись.</text>
					<text id="t69" class="s8" x="0" y="139">3.</text>
					<text id="t70" class="s8" x="14" y="139">Метрическая книга Свято-Троицкой церкви с. Станового за 1911 год</text>
					<text id="t71" class="s8" x="429" y="139">. Тип: Книга или рукопись. 100%</text>
					<text id="t72" class="s8" x="0" y="157">сплошная вычитка всех трех частей: рождений (37 сканов, июль-декабрь лл. 207-229), браков (100% всех 22</text>
					<text id="t73" class="s8" x="0" y="175">браков года, лл. 230-237), умерших (январь-март, лл. 238-242). Ключевые находки Класса А: 1) Венчание</text>
					<text id="t74" class="s8" x="0" y="193">Игнатия Меркурьевича Стрункина (06.02.1911, брак № 14) с Марией Ильиничной Шубиной, поручитель родной</text>
					<text id="t75" class="s8" x="0" y="211">брат Феодор Меркурьевич Стрункин; 2) Рождение Анны (11.11.1911, зап. 155 ж.) у Ивана Меркурьевича</text>
					<text id="t76" class="s8" x="0" y="229">Стрункина и Клавдии Артемьевой, восприемники — Василий Меркурьевич Стрункин (11 лет) и Мария</text>
					<text id="t77" class="s8" x="0" y="247">Павловна Тараканова; 3) Восприемник Игнатий Меркурьевич Стрункин (20.11.1911); 4) Венчание Ивана</text>
					<text id="t78" class="s8" x="0" y="265">Ивановича Савиных и Агриппины Трофимовны Орловой (22.05.1911, брак № 19); 5) Брак Гавриила</text>
					<text id="t79" class="s8" x="0" y="283">Афанасьевича Антропова (04.02.1911); 6) Брак Евдокии Ивановны Дудиной (06.02.1911); 7) Рождение Нины у</text>
					<text id="t80" class="s8" x="0" y="301">Дмитрия Павловича Тараканова (29.07.1911); 8) Рождение Параскевы у Стефана Ивановича Савиных</text>
					<text id="t81" class="s8" x="0" y="319">(27.10.1911).</text>
				</g>
			</g>
			<script type="text/javascript">//<![CDATA[
navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else a[i].addEventListener('click', jumpTo);
}
a = undefined;

window.addEventListener('DOMContentLoaded', function (){ window.parent.postMessage({event_id: 'gheight', data: document.body.scrollHeight}, '*');});

					<text id="t4" class="s8" x="0" y="49">Родной брат Василия Меркурьевича Стрункина. Родился в 1892 г., умер 14.02.1957. Памятник с портретным</text>
					<text id="t5" class="s8" x="0" y="67">овалом на кладбище с. Речного. Герой Первой мировой войны: ефрейтор 1-го Заамурского пограничного</text>

					<text id="t7" class="s8" x="0" y="103">потерь, ящик 3237-С, док. 106). Отец Валентины, Николая, Геннадия, Марии, Павла, Владимира Стрункиных.</text>

					<text id="t107" class="s8" x="0" y="13">Источники:</text>
					<text id="t108" class="s8" x="0" y="31">1.</text>
					<text id="t109" class="s8" x="14" y="31">Памятники и эмалированные портреты кладбища с. Речного (ОГАЧО / Фотоархив, 54.613889° N, 63.972500°</text>
					<text id="t110" class="s8" x="0" y="49">E). Стрункин Иван Меркурьевич и Клавдия Артемьевна; Стрункин Игнатий Меркульевич (1892 - 14.02.1957).</text>
					<text id="t111" class="s8" x="0" y="67">Тип: Книга или рукопись.</text>
					<text id="t112" class="s8" x="0" y="85">2.</text>
					<text id="t113" class="s8" x="14" y="85">РГВИА (Российский государственный военно-исторический архив), Картотека бюро учета потерь в Первой</text>
					<text id="t114" class="s8" x="0" y="103">мировой войне 1914–1918 гг. (Ящик 3237-С, Док. 106; Ящик 4433-Т, Док. 610; Ф. 16196, Оп. 1, Д. 562, л. 82).</text>
					<text id="t115" class="s8" x="0" y="121">Тип: Книга или рукопись.</text>
					<text id="t116" class="s8" x="0" y="139">3.</text>
					<text id="t117" class="s8" x="14" y="139">Метрическая книга Свято-Троицкой церкви с. Станового за 1911 год</text>
					<text id="t118" class="s8" x="429" y="139">. Тип: Книга или рукопись. 100%</text>
					<text id="t119" class="s8" x="0" y="157">сплошная вычитка всех трех частей: рождений (37 сканов, июль-декабрь лл. 207-229), браков (100% всех 22</text>
					<text id="t120" class="s8" x="0" y="175">браков года, лл. 230-237), умерших (январь-март, лл. 238-242). Ключевые находки Класса А: 1) Венчание</text>
					<text id="t121" class="s8" x="0" y="193">Игнатия Меркурьевича Стрункина (06.02.1911, брак № 14) с Марией Ильиничной Шубиной, поручитель родной</text>
					<text id="t122" class="s8" x="0" y="211">брат Феодор Меркурьевич Стрункин; 2) Рождение Анны (11.11.1911, зап. 155 ж.) у Ивана Меркурьевича</text>
					<text id="t123" class="s8" x="0" y="229">Стрункина и Клавдии Артемьевой, восприемники — Василий Меркурьевич Стрункин (11 лет) и Мария</text>
					<text id="t124" class="s8" x="0" y="247">Павловна Тараканова; 3) Восприемник Игнатий Меркурьевич Стрункин (20.11.1911); 4) Венчание Ивана</text>
					<text id="t125" class="s8" x="0" y="265">Ивановича Савиных и Агриппины Трофимовны Орловой (22.05.1911, брак № 19); 5) Брак Гавриила</text>
					<text id="t126" class="s8" x="0" y="283">Афанасьевича Антропова (04.02.1911); 6) Брак Евдокии Ивановны Дудиной (06.02.1911); 7) Рождение Нины у</text>
					<text id="t127" class="s8" x="0" y="301">Дмитрия Павловича Тараканова (29.07.1911); 8) Рождение Параскевы у Стефана Ивановича Савиных</text>
					<text id="t128" class="s8" x="0" y="319">(27.10.1911).</text>

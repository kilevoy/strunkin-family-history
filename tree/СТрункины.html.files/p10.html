					<text id="t3" class="s8" x="0" y="31">актовой записью МК 1868 года (ОГАЧО, Ф. И-226, Оп. 1, Д. 432, л. 746, брак № 28).</text>

						<text id="t36" class="s8" x="0" y="49">Михайловым Новоселовым вместе с Илларионом Меркурьевым Скутиным (МК 1868, скан p0746,</text>

					<text id="t61" class="s8" x="14" y="31">Метрическая книга Свято-Троицкой церкви с. Станового за 1868 год</text>
					<text id="t62" class="s8" x="429" y="31">. Тип: Книга или рукопись. 100%</text>
					<text id="t63" class="s8" x="0" y="49">поголовная вычитка трёх частей: 293 рождения (156 м., 137 ж.), 69 браков, 206 смертей (всего 568 первичных</text>
					<text id="t64" class="s8" x="0" y="67">записей). Рождение Меркурия Филипповича Стрункина среди 156 мальчиков 1868 года отсутствует (Класс А</text>
					<text id="t65" class="s8" x="0" y="85">отрицательный факт; окно сузилось строго до 1869 г.). Прямой предок Филипп Кузьмин Стрункин (д. Речная)</text>
					<text id="t66" class="s8" x="0" y="103">зафиксирован как поручитель на венчании 28.01.1868 (Класс А). Михаил Иванович Стрункин зафиксирован как</text>
					<text id="t67" class="s8" x="0" y="121">восприемник (скан p0830). Выявлены ветви Савиных д. Сетовой (рождение Марфы Андреевны 23.11.1868;</text>
					<text id="t68" class="s8" x="0" y="139">поручительство братьев Феодора и Михаила Евфимовых Савиных 17.01.1868, поручительство Ивана</text>
					<text id="t69" class="s8" x="0" y="157">Ивановича Савиных 21.01.1868), Шумиловых (рождение Николая Ивановича 30.11.1868, смерть Анны</text>
					<text id="t70" class="s8" x="0" y="175">Аввакумовны 03.06.1868), Дудиных (рождение Феодора Мартиниановича 18.05.1868, брак Ольги Филипповой</text>
					<text id="t71" class="s8" x="0" y="193">Бабиковой с поручительством братьев Бабиковых 02.02.1868).</text>

navTo = function() {

	else

a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else a[i].addEventListener('click', jumpTo);
}
a = undefined;

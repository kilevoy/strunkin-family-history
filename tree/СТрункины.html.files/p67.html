		<svg xmlns:svg="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="680" height="474" id="svg0">
			<g id="g0">
				<g id="g1">
					<text id="t0" class="s4" x="0" y="19">Стрункина Анна Ивановна</text>
				</g>
				<g id="g2" transform="translate(0,25)">
					<text id="t1" class="s6" x="0" y="16">(11.11.1911)</text>
				</g>
				<g id="g3" transform="translate(0,55)">
					<text id="t2" class="s8" x="0" y="13">Возраст: 114</text>
					<text id="t3" class="s8" x="0" y="31">Рождение Анны (11.11.1911, крещена 13.11.1911, зап. № 155 ж., л. 223, скан p0226). Родители: крестьянин д.</text>
					<text id="t4" class="s8" x="0" y="49">Рытной Иван Меркурьевич Стрункин и законная жена его Клавдия Артемьева. Восприемники: крестьянин д.</text>
					<text id="t5" class="s8" x="0" y="67">Рытной Василий Меркурьевич Стрункин (будущий дед, 11 лет) и крестьянская девица Мария Павловна</text>
					<text id="t6" class="s8" x="0" y="85">Тараканова.</text>
				</g>
				<g id="g4" transform="translate(0,159)">
					<g id="g5">
						<text id="t7" class="s8" x="0" y="13">Отец:</text>
						<text id="t8" class="s9 po" x="37" y="13" data-link="p17.html">Стрункин Иван Меркурьевич (Около 1886 – 31.07.1964)</text>
						<text id="t9" class="s8" x="0" y="31">Мать:</text>
						<text id="t10" class="s9 po" x="37" y="31" data-link="p18.html">Стрункина Клавдия Артемьевна (Около 1890 – ?)</text>
					</g>
				</g>
				<g id="g6" transform="translate(0,209)">
					<g id="g8" transform="translate(1,0)">
						<text id="t12" class="s10" x="0" y="13">11.11.1911</text>
					</g>
					<g id="g9" transform="translate(76,0)">
						<text id="t13" class="s8" x="0" y="13">Родилась</text>
						<text id="t14" class="s8" x="59" y="13">. Отец:</text>
						<text id="t15" class="s9 po" x="104" y="13" data-link="p17.html">Стрункин Иван Меркурьевич (Около 1886 – 31.07.1964)</text>
						<text id="t16" class="s8" x="440" y="13">. Мать:</text>
						<text id="t17" class="s9 po" x="486" y="13" data-link="p18.html">Стрункина Клавдия</text>
						<text id="t18" class="s9 po" x="0" y="31" data-link="p18.html">Артемьевна (Около 1890 – ?)</text>
						<text id="t19" class="s8" x="178" y="31">. Место:</text>
						<text id="t20" class="s8" x="230" y="31">Оренбургская губ.</text>
						<text id="t21" class="s8" x="344" y="31">[1].</text>
					</g>
				</g>
				<g id="g10" transform="translate(0,259)">
					<text id="t22" class="s8" x="0" y="13">Источники:</text>
					<text id="t23" class="s8" x="0" y="31">1.</text>
					<text id="t24" class="s8" x="14" y="31">Метрическая книга Свято-Троицкой церкви с. Станового за 1911 год</text>
					<text id="t25" class="s8" x="429" y="31">. Тип: Книга или рукопись. 100%</text>
					<text id="t26" class="s8" x="0" y="49">сплошная вычитка всех трех частей: рождений (37 сканов, июль-декабрь лл. 207-229), браков (100% всех 22</text>
					<text id="t27" class="s8" x="0" y="67">браков года, лл. 230-237), умерших (январь-март, лл. 238-242). Ключевые находки Класса А: 1) Венчание</text>
					<text id="t28" class="s8" x="0" y="85">Игнатия Меркурьевича Стрункина (06.02.1911, брак № 14) с Марией Ильиничной Шубиной, поручитель родной</text>
					<text id="t29" class="s8" x="0" y="103">брат Феодор Меркурьевич Стрункин; 2) Рождение Анны (11.11.1911, зап. 155 ж.) у Ивана Меркурьевича</text>
					<text id="t30" class="s8" x="0" y="121">Стрункина и Клавдии Артемьевой, восприемники — Василий Меркурьевич Стрункин (11 лет) и Мария</text>
					<text id="t31" class="s8" x="0" y="139">Павловна Тараканова; 3) Восприемник Игнатий Меркурьевич Стрункин (20.11.1911); 4) Венчание Ивана</text>
					<text id="t32" class="s8" x="0" y="157">Ивановича Савиных и Агриппины Трофимовны Орловой (22.05.1911, брак № 19); 5) Брак Гавриила</text>
					<text id="t33" class="s8" x="0" y="175">Афанасьевича Антропова (04.02.1911); 6) Брак Евдокии Ивановны Дудиной (06.02.1911); 7) Рождение Нины у</text>
					<text id="t34" class="s8" x="0" y="193">Дмитрия Павловича Тараканова (29.07.1911); 8) Рождение Параскевы у Стефана Ивановича Савиных</text>
					<text id="t35" class="s8" x="0" y="211">(27.10.1911).</text>
				</g>

			<script type="text/javascript">//<![CDATA[
navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else a[i].addEventListener('click', jumpTo);
}
a = undefined;

window.parent.postMessage({event_id: 'gmsg', data: 'g500'}, '*');
window.addEventListener('keydown', function(e){ if( (e.keyCode && e.keyCode === 27) || ( e.code && e.code === "Escape") ) window.parent.postMessage({event_id: 'gclose', data: 'close'}, '*'); }, false );
window.addEventListener('DOMContentLoaded', function (){ window.parent.postMessage({event_id: 'gheight', data: document.body.scrollHeight}, '*');});
//]]></script>

					<text id="t83" class="s8" x="14" y="31">Метрическая книга Свято-Троицкой церкви с. Станового за 1911 год</text>

					<text id="t86" class="s8" x="0" y="67">браков года, лл. 230-237), умерших (январь-март, лл. 238-242). Ключевые находки Класса А: 1) Венчание</text>

					<text id="t90" class="s8" x="0" y="139">Павловна Тараканова; 3) Восприемник Игнатий Меркурьевич Стрункин (20.11.1911); 4) Венчание Ивана</text>
					<text id="t91" class="s8" x="0" y="157">Ивановича Савиных и Агриппины Трофимовны Орловой (22.05.1911, брак № 19); 5) Брак Гавриила</text>
					<text id="t92" class="s8" x="0" y="175">Афанасьевича Антропова (04.02.1911); 6) Брак Евдокии Ивановны Дудиной (06.02.1911); 7) Рождение Нины у</text>

		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);

		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }

}

					<text id="t2" class="s8" x="0" y="13">Прямой предок семьи. Проверены поголовно метрические книги прихода за 1850–1868 годы (&gt;1550 мальчиков,</text>

					<text id="t139" class="s8" x="0" y="13">Источники:</text>
					<text id="t140" class="s8" x="0" y="31">1.</text>
					<text id="t141" class="s8" x="14" y="31">МК Свято-Троицкой церкви с. Станового за 1863 г</text>
					<text id="t142" class="s8" x="318" y="31">. Тип: Книга или рукопись. 100% вычитаны все 3 раздела</text>
					<text id="t143" class="s8" x="0" y="49">(~280 рождений: 143 м. / ~137 ж., 41 брак, 318 смертей: 155 м. / 163 ж., всего 639 первичных актовых записей).</text>
					<text id="t144" class="s8" x="0" y="67">СТРУНКИНЫ: поручительство Осипа Игнатьева Стрункина на браке № 40 от 03.11.1863 г. (открыт источник</text>
					<text id="t145" class="s8" x="0" y="85">имени Игнатий). Рождение Меркурия Стрункина в январе–ноябре 1863 г. отсутствует на 100% (диапазон сужен</text>
					<text id="t146" class="s8" x="0" y="103">до блока декабрьских рождений 1863 г. и 1864 г.). САВИНЫХ / ШУМИЛОВЫ (д. Сетова): венчание Каллистрата</text>
					<text id="t147" class="s8" x="0" y="121">Федорова Савина (14.01.1863, брак № 6, поручители Никон и Захар Михайловы Осиповы Савиных); смерти</text>
					<text id="t148" class="s8" x="0" y="139">Ивана Васильева Шумилова (45 лет) и Пелагеи Трофимовой Шумиловой (75 лет); смерти детей Савиных от</text>
					<text id="t149" class="s8" x="0" y="157">эпидемии кори и скарлатины. ДУДИНЫ: брак Агриппины Козьминой Кокшаровой и смерть дочери Александры</text>
					<text id="t150" class="s8" x="0" y="175">Васильевой Дудиной.</text>
					<text id="t151" class="s8" x="0" y="193">2.</text>
					<text id="t152" class="s8" x="14" y="193">МК Свято-Троицкой церкви с. Станового за 1864 г</text>
					<text id="t153" class="s8" x="318" y="193">. Тип: Книга или рукопись. 100% вычитаны все 3 раздела:</text>
					<text id="t154" class="s8" x="0" y="211">317 рождений (171 м., 146 ж. + 29 переходящих ноябрь-декабрь 1863 г.), 64 брака, 246 смертей (всего 627</text>
					<text id="t155" class="s8" x="0" y="229">записей). Меркурий Стрункин не рождался. Находки: патриарх Василий Иванович Шумилов (умер в 90 лет),</text>
					<text id="t156" class="s8" x="0" y="247">Прокопий Лукич Савиных (70 лет), Тит Матвеевич Савиных (55 лет), Сидор Васильевич Савиных (79 лет), Карп</text>
					<text id="t157" class="s8" x="0" y="265">Дудин, Анна Максимовна Инютина.</text>
					<text id="t158" class="s8" x="0" y="283">3.</text>
					<text id="t159" class="s8" x="14" y="283">МК Свято-Троицкой церкви с. Станового за 1865 г</text>
					<text id="t160" class="s8" x="318" y="283">. Тип: Книга или рукопись. 100% вычитаны все 3 раздела:</text>
					<text id="t161" class="s8" x="0" y="301">250 рождений (120 м., 130 ж. + 4 переходящих), 35 браков, 212 смертей (всего 497 записей). Меркурий</text>
					<text id="t162" class="s8" x="0" y="319">Стрункин в 1865 г. не рождался. Находки: патриархи Лука Петрович Савиных (75 лет), Стефан Петрович</text>
					<text id="t163" class="s8" x="0" y="337">Кредтов (80 лет), Василий Никитич Савиных (85 лет), Екатерина Гавриловна Негоева (70 лет), Фома Иванович</text>
					<text id="t164" class="s8" x="0" y="355">Осипов (51 год); брак Евдокии Ивановны Дудиной и поручители Поликарп и Петр Бабиковы; брак Ирины</text>
					<text id="t165" class="s8" x="0" y="373">Ионовны Ишимцевой [Дудиной] и поручители Андрей и Трофим Ишимцевы.</text>
					<text id="t166" class="s8" x="0" y="391">4.</text>
					<text id="t167" class="s8" x="14" y="391">МК Свято-Троицкой церкви с. Станового за 1866 г</text>
					<text id="t168" class="s8" x="318" y="391">. Тип: Книга или рукопись. 100% вычитаны все 3 раздела:</text>
					<text id="t169" class="s8" x="0" y="409">316 рождений (159 м., 157 ж.), 39 браков, 242 смерти (всего 597 записей). Меркурий Стрункин в 1866 г. не</text>
					<text id="t170" class="s8" x="0" y="427">рождался. Находки Класса А: смерть дочери Филиппа Стрункина Екатерины (1 год); гибель Даниила</text>
					<text id="t171" class="s8" x="0" y="445">Абрамовича Кудрявцева (52 г., задавлен возом); смерти Варвары Димитриевны Осиповой (85 лет), Николая</text>
					<text id="t172" class="s8" x="0" y="463">Макаровича Васильева (70 лет), Матвея Мефодиевича Шумилова (50 лет), Гордея Козьмича Карелина (50 лет,</text>
					<text id="t173" class="s8" x="0" y="481">д. Речная); рождение Анисии Дудиной (д. Дудина); 14 браков рода Савиных и Шумиловых.</text>
					<text id="t174" class="s8" x="0" y="499">5.</text>
					<text id="t175" class="s8" x="14" y="499">МК Свято-Троицкой церкви с. Станового за 1867 г</text>
					<text id="t176" class="s8" x="318" y="499">. Тип: Книга или рукопись. 100% поголовно вычитаны все 3</text>
					<text id="t177" class="s8" x="0" y="517">раздела: 236 рождений (104 м., 132 ж.), 25 браков, 156 смертей (всего 417 первичных актовых записей).</text>
					<text id="t178" class="s8" x="0" y="535">Меркурий Филиппович Стрункин среди всех 104 мальчиков отсутствует (Класс А отрицательный факт; окно</text>
					<text id="t179" class="s8" x="0" y="553">рождения сузилось строго до 1868–1869 гг.). Находки Класса А: рождение Гликерии Яковлевны Стрункиной</text>
					<text id="t180" class="s8" x="0" y="571">(10.04.1867, д. Речная); ветвь Таракановых д. Речной (рождение Гликерии Ивановны Таракановой 09.05.1867,</text>
					<text id="t181" class="s8" x="0" y="589">поручительство Ивана Ивановича Тараканова 25.01.1867, восприемник Степан Иванович Тараканов); ветвь</text>
					<text id="t182" class="s8" x="0" y="607">Савиных (рождение Иулиании Андреевны Савиных 05.07.1867, восприемник Василий Савиных 01.02.1867);</text>
					<text id="t183" class="s8" x="0" y="625">брак Агафии Прохоровны Перескоковой из д. Речной (18.10.1867); рождение Настасьи Тимофеевны Инютиной</text>
					<text id="t184" class="s8" x="0" y="643">(20.12.1867).</text>
					<text id="t185" class="s8" x="0" y="661">6.</text>
					<text id="t186" class="s8" x="14" y="661">Метрическая книга Свято-Троицкой церкви с. Станового за 1868 год</text>
					<text id="t187" class="s8" x="429" y="661">. Тип: Книга или рукопись. 100%</text>
					<text id="t188" class="s8" x="0" y="679">поголовная вычитка трёх частей: 293 рождения (156 м., 137 ж.), 69 браков, 206 смертей (всего 568 первичных</text>
					<text id="t189" class="s8" x="0" y="697">записей). Рождение Меркурия Филипповича Стрункина среди 156 мальчиков 1868 года отсутствует (Класс А</text>
					<text id="t190" class="s8" x="0" y="715">отрицательный факт; окно сузилось строго до 1869 г.). Прямой предок Филипп Кузьмин Стрункин (д. Речная)</text>
					<text id="t191" class="s8" x="0" y="733">зафиксирован как поручитель на венчании 28.01.1868 (Класс А). Михаил Иванович Стрункин зафиксирован как</text>
					<text id="t192" class="s8" x="0" y="751">восприемник (скан p0830). Выявлены ветви Савиных д. Сетовой (рождение Марфы Андреевны 23.11.1868;</text>
					<text id="t193" class="s8" x="0" y="769">поручительство братьев Феодора и Михаила Евфимовых Савиных 17.01.1868, поручительство Ивана</text>
					<text id="t194" class="s8" x="0" y="787">Ивановича Савиных 21.01.1868), Шумиловых (рождение Николая Ивановича 30.11.1868, смерть Анны</text>
					<text id="t195" class="s8" x="0" y="805">Аввакумовны 03.06.1868), Дудиных (рождение Феодора Мартиниановича 18.05.1868, брак Ольги Филипповой</text>
					<text id="t196" class="s8" x="0" y="823">Бабиковой с поручительством братьев Бабиковых 02.02.1868).</text>
					<text id="t197" class="s8" x="0" y="841">7.</text>
					<text id="t198" class="s8" x="14" y="841">Метрическая книга Свято-Троицкой церкви с. Станового за 1893 год</text>
					<text id="t199" class="s8" x="429" y="841">. Тип: Книга или рукопись. 100%</text>
					<text id="t200" class="s8" x="0" y="859">сплошная вычитка всех 3 частей: 239 рождений, 63 брака, 227 умерших. Находка Класса А: Меркурий</text>
					<text id="t201" class="s8" x="0" y="877">Филиппович Стрункин — восприемник 11/17.07.1893 (л. 892, скан p0103). Братья Михаил и Меркурий</text>
					<text id="t202" class="s8" x="0" y="895">Таракановы в д. Рычной.</text>
					<text id="t203" class="s8" x="0" y="913">8.</text>
					<text id="t204" class="s8" x="14" y="913">МК Свято-Троицкой церкви с. Станового за 1900 г., Часть 1, О родившихся (ОГАЧО, Ф. И-226, Оп. 1, Д. 551,</text>
					<text id="t205" class="s8" x="0" y="931">кадры 6–7 / страницы 111–112, записи муж. № 16 и 18).</text>

navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else a[i].addEventListener('click', jumpTo);
}
a = undefined;

				<g id="g2" transform="translate(0,25)">
					<text id="t1" class="s6" x="0" y="16">(20.01.1908)</text>
				</g>
				<g id="g3" transform="translate(0,55)">
					<text id="t2" class="s8" x="0" y="13">Возраст: 118</text>
					<text id="t3" class="s8" x="0" y="31">Баба Аня. Родилась 20.01.1908 в деревне Сетовой (семейная тетрадь записей б. Зины). Мать — Ефросинья</text>
					<text id="t4" class="s8" x="0" y="49">(прямая прапрабабушка, умерла рано), отец — Иван Савиных (в записи б. Зины — Яковлевич), мачеха —</text>
					<text id="t5" class="s8" x="0" y="67">Наталья Константиновна. Вышла замуж за Ефима Меркурьевича Тараканова. Сёстры: старшая Мария (в</text>
					<text id="t6" class="s8" x="0" y="85">замужестве Бабушкина, род. ок. 1897 г., Класс А) и Зинаида (жила в Сетово); братья Савиных (участники</text>
					<text id="t7" class="s8" x="0" y="103">Гражданской войны). Документы советского периода — в архивном отделе и ЗАГС Администрации Целинного</text>
					<text id="t8" class="s8" x="0" y="121">района Курганской области.</text>
				</g>
				<g id="g4" transform="translate(0,195)">

						<text id="t9" class="s8" x="0" y="13">Отец:</text>
						<text id="t10" class="s9 po" x="37" y="13" data-link="p6.html">Савиных Иван Иванович (Около 1875 – ?)</text>
						<text id="t11" class="s8" x="0" y="31">Мать:</text>
						<text id="t12" class="s9 po" x="37" y="31" data-link="p29.html">(Савиных) Ефросинья (Около 1875 – До 1914)</text>
						<text id="t13" class="s8" x="0" y="49">Брат:</text>
						<text id="t14" class="s9 po" x="36" y="49" data-link="p69.html">Савиных Иван Иванович (Около 1891 – ?)</text>
						<text id="t15" class="s8" x="0" y="67">Сестра:</text>
						<text id="t16" class="s9 po" x="50" y="67" data-link="p30.html">Савиных (Бабушкина) Мария Ивановна (Около 1897 – ?)</text>
						<text id="t17" class="s8" x="0" y="85">Сестра:</text>
						<text id="t18" class="s9 po" x="50" y="85" data-link="p31.html">Савиных Зинаида Ивановна (Около 1910)</text>

						<text id="t23" class="s8" x="0" y="139">    Дочь:</text>

			<script type="text/javascript">//<![CDATA[
navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else a[i].addEventListener('click', jumpTo);
}
a = undefined;

window.parent.postMessage({event_id: 'gmsg', data: 'g568'}, '*');
window.addEventListener('keydown', function(e){ if( (e.keyCode && e.keyCode === 27) || ( e.code && e.code === "Escape") ) window.parent.postMessage({event_id: 'gclose', data: 'close'}, '*'); }, false );
window.addEventListener('DOMContentLoaded', function (){ window.parent.postMessage({event_id: 'gheight', data: document.body.scrollHeight}, '*');});
//]]></script>

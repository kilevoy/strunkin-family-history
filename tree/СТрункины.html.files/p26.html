	<body>
		<svg xmlns:svg="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="678" height="677" id="svg0">
			<g id="g0">
				<g id="g1">
					<text id="t0" class="s4" x="0" y="19">Стрункин Михаил Меркурьевич</text>
				</g>
				<g id="g2" transform="translate(0,46)">
					<text id="t1" class="s6" x="0" y="13">Крестьянин д. Рытной (Речной). Родной брат деда Василия Стрункина. Документально подтвержден</text>
					<text id="t2" class="s6" x="0" y="31">первичными архивными записями Класса А в январе и июне 1905 г. (ОГАЧО, Ф. И-226, Оп. 1, Д. 557, л. 307,</text>
					<text id="t3" class="s6" x="0" y="49">рожд. № 10 и л. 341, рожд. № 97): 15/23 января 1905 г. — восприемник новорожденного Григория у Стефана</text>
					<text id="t4" class="s6" x="0" y="67">Меркурьевича Тараканова; 21/24 июня 1905 г. — восприемник новорожденного Петра у Андрея Евдокимова</text>
					<text id="t5" class="s6" x="0" y="85">Шкунова! Полностью подтверждает живую память семьи о сыновьях Меркурия Стрункина.</text>
				</g>
				<g id="g3" transform="translate(0,150)">
					<text id="t6" class="s6" x="0" y="13">Ссылки на источники:</text>
					<text id="t7" class="s6" x="0" y="31">[1]</text>
					<text id="t8" class="s6" x="0" y="49">[2]</text>
				</g>
				<g id="g4" transform="translate(0,218)">
					<g id="g5">
						<text id="t9" class="s6" x="0" y="13">Отец:</text>
						<text id="t10" class="s7 po" x="37" y="13" data-link="p7.html">Стрункин Меркурий Филиппович (Около 1869 – ?)</text>
						<text id="t11" class="s6" x="0" y="31">Мать:</text>
						<text id="t12" class="s7 po" x="37" y="31" data-link="p8.html">Стрункина Мария Тимофеевна (Около 1865 – ?)</text>
						<text id="t13" class="s6" x="0" y="49">Брат:</text>
						<text id="t14" class="s7 po" x="36" y="49" data-link="p9.html">Стрункин Феодот Меркурьевич (Около 1878 – ?)</text>
						<text id="t15" class="s6" x="0" y="67">Сестра:</text>
						<text id="t16" class="s7 po" x="50" y="67" data-link="p20.html">Стрункина Пелагия Меркуриевна (Около 1881 – ?)</text>
						<text id="t17" class="s6" x="0" y="85">Брат:</text>
						<text id="t18" class="s7 po" x="36" y="85" data-link="p17.html">Стрункин Иван Меркурьевич (Около 1886 – 31.07.1964)</text>
						<text id="t19" class="s6" x="0" y="103">Сестра:</text>
						<text id="t20" class="s7 po" x="50" y="103" data-link="p27.html">Стрункина Авдотья (Евдокия) Меркуриевна (Около 1888 – ?)</text>
						<text id="t21" class="s6" x="0" y="121">Брат:</text>
						<text id="t22" class="s7 po" x="36" y="121" data-link="p19.html">Стрункин Игнатий Меркульевич (1892 – 14.02.1957)</text>
						<text id="t23" class="s6" x="0" y="139">Брат:</text>
						<text id="t24" class="s7 po" x="36" y="139" data-link="p3.html">Стрункин Василий Меркурьевич (28.01.1900 – 06.02.1942)</text>
						<text id="t25" class="s6" x="0" y="157">Брат:</text>
						<text id="t26" class="s7 po" x="36" y="157" data-link="p63.html">Стрункин Иосиф Меркурьевич</text>
					</g>
				</g>
				<g id="g6" transform="translate(0,394)">
					<g id="g9" transform="translate(11,0)">
						<text id="t27" class="s6" x="0" y="13">Родился</text>
						<text id="t28" class="s6" x="52" y="13">. Отец:</text>
						<text id="t29" class="s7 po" x="97" y="13" data-link="p7.html">Стрункин Меркурий Филиппович (Около 1869 – ?)</text>
						<text id="t30" class="s6" x="398" y="13">. Мать:</text>
						<text id="t31" class="s7 po" x="444" y="13" data-link="p8.html">Стрункина Мария Тимофеевна</text>
						<text id="t32" class="s7 po" x="0" y="31" data-link="p8.html">(Около 1865 – ?)</text>
						<text id="t33" class="s6" x="101" y="31">. Место:</text>
						<text id="t34" class="s6" x="153" y="31">Оренбургская губ.</text>
					</g>
				</g>
				<g id="g10" transform="translate(0,444)">
					<text id="t35" class="s6" x="0" y="13">Источники:</text>
					<text id="t36" class="s6" x="0" y="31">1.</text>
					<text id="t37" class="s6" x="14" y="31">Устное свидетельство внучки Ивана Меркурьевича Стрункина (телефонный опрос 26.10.2026): точные даты</text>
					<text id="t38" class="s6" x="0" y="49">жизни деда Ивана с бородой (ок. 1886 - 31.07.1964), состав детей Меркурия (сыновья Иван, Федот, Михаил,</text>
					<text id="t39" class="s6" x="0" y="67">Василий, Игнатий и дочь Авдотья).</text>
					<text id="t40" class="s6" x="216" y="67">Тип: Книга или рукопись.</text>
					<text id="t41" class="s6" x="0" y="85">2.</text>
					<text id="t42" class="s6" x="14" y="85">Метрическая книга Свято-Троицкой церкви с. Станового за 1905 год</text>
					<text id="t43" class="s6" x="429" y="85">. Тип: Книга или рукопись. 100%</text>
					<text id="t44" class="s6" x="0" y="103">сплошная вычитка Части 1 (рождения) и Части 2 (бракосочетания). Ключевые открытия Класса А: 1)</text>
					<text id="t45" class="s6" x="0" y="121">Крестьянин д. Рытной Михаил Меркурьевич Стрункин — дважды зафиксирован восприемником (15/23.01.1905,</text>
					<text id="t46" class="s6" x="0" y="139">л. 307 у Стефана Меркурьевича Тараканова и 21/24.06.1905, л. 341 у Андрея Шкунова); 2) Рождение Григория</text>
					<text id="t47" class="s6" x="0" y="157">у Стефана Меркурьевича Тараканова (15.01.1905); 3) Венчание Елизаветы Ивановны Савиных (21.01.1905,</text>
					<text id="t48" class="s6" x="0" y="175">брак № 5) с Андреем Белясовым; 4) Венчание Параскевы Симеоновны Дудиной (02.02.1905, брак № 22),</text>
					<text id="t49" class="s6" x="0" y="193">поручители — крестьяне д. Дудиной Симеон Михайлович Дудин и Прокопий Александрович Дудин; 5)</text>
					<text id="t50" class="s6" x="0" y="211">Восприемник Иван Иванович Савиных (17.10.1905); 6) Рождение Клавдии у Иосифа Ивановича Савиных</text>
					<text id="t51" class="s6" x="0" y="229">(23.12.1905).</text>
				</g>
			</g>
			<script type="text/javascript">//<![CDATA[
navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else a[i].addEventListener('click', jumpTo);
}
a = undefined;

window.parent.postMessage({event_id: 'gmsg', data: 'g532'}, '*');
window.addEventListener('keydown', function(e){ if( (e.keyCode && e.keyCode === 27) || ( e.code && e.code === "Escape") ) window.parent.postMessage({event_id: 'gclose', data: 'close'}, '*'); }, false );
window.addEventListener('DOMContentLoaded', function (){ window.parent.postMessage({event_id: 'gheight', data: document.body.scrollHeight}, '*');});
//]]></script>
		</svg>

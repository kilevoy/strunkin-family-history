				</g>
				<g id="g3" transform="translate(0,55)">
					<text id="t2" class="s8" x="0" y="13">Основное занятие: Красноармеец 1217-го стрелкового полка 367-й стрелковой дивизии</text>
					<text id="t3" class="s8" x="0" y="31">Продолжительность жизни: 42</text>
					<text id="t4" class="s8" x="0" y="49">Родился 28.01.1900 в деревне Речной, крещён 30.01.1900 в Свято-Троицкой церкви с. Станового (ОГАЧО, Ф.</text>
					<text id="t5" class="s8" x="0" y="67">И-226, Оп. 1, Д. 551, кадр 6 / стр. 111, зап. 16). В Великую Отечественную войну - красноармеец 1217-го</text>
					<text id="t6" class="s8" x="0" y="85">стрелкового полка 367-й стрелковой дивизии (призыв Усть-Уйского РВК). Пропал без вести 06.02.1942 в бою за</text>
					<text id="t7" class="s8" x="0" y="103">Кировскую железную дорогу в районе разъезда 14 км (Республика Карелия, Медвежьегорский район, ЦАМО</text>
					<text id="t8" class="s8" x="0" y="121">РФ, Ф. 58, Оп. 18001, Д. 680, кадр 86, запись 1157, Карточка героя 90551585).</text>

					<text id="t105" class="s8" x="14" y="67">Семейный архив и устные свидетельства семьи Стрункиных (память матери заявителя об Игнатии</text>
					<text id="t106" class="s8" x="0" y="85">Стрункине и 6 детях, фото деда Ивана с коровами).</text>

navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))

	else
		window.open(this.dataset.link, '_blank');
};

a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else a[i].addEventListener('click', jumpTo);
}
a = undefined;

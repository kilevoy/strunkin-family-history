					<text id="t28" class="s8" x="14" y="31">Памятники и эмалированные портреты кладбища с. Речного (ОГАЧО / Фотоархив, 54.613889° N, 63.972500°</text>
					<text id="t29" class="s8" x="0" y="49">E). Стрункин Иван Меркурьевич и Клавдия Артемьевна; Стрункин Игнатий Меркульевич (1892 - 14.02.1957).</text>
					<text id="t30" class="s8" x="0" y="67">Тип: Книга или рукопись.</text>
					<text id="t31" class="s8" x="0" y="85">2.</text>
					<text id="t32" class="s8" x="14" y="85">Метрическая книга Свято-Троицкой церкви с. Станового за 1911 год</text>
					<text id="t33" class="s8" x="429" y="85">. Тип: Книга или рукопись. 100%</text>
					<text id="t34" class="s8" x="0" y="103">сплошная вычитка всех трех частей: рождений (37 сканов, июль-декабрь лл. 207-229), браков (100% всех 22</text>
					<text id="t35" class="s8" x="0" y="121">браков года, лл. 230-237), умерших (январь-март, лл. 238-242). Ключевые находки Класса А: 1) Венчание</text>
					<text id="t36" class="s8" x="0" y="139">Игнатия Меркурьевича Стрункина (06.02.1911, брак № 14) с Марией Ильиничной Шубиной, поручитель родной</text>
					<text id="t37" class="s8" x="0" y="157">брат Феодор Меркурьевич Стрункин; 2) Рождение Анны (11.11.1911, зап. 155 ж.) у Ивана Меркурьевича</text>
					<text id="t38" class="s8" x="0" y="175">Стрункина и Клавдии Артемьевой, восприемники — Василий Меркурьевич Стрункин (11 лет) и Мария</text>
					<text id="t39" class="s8" x="0" y="193">Павловна Тараканова; 3) Восприемник Игнатий Меркурьевич Стрункин (20.11.1911); 4) Венчание Ивана</text>
					<text id="t40" class="s8" x="0" y="211">Ивановича Савиных и Агриппины Трофимовны Орловой (22.05.1911, брак № 19); 5) Брак Гавриила</text>
					<text id="t41" class="s8" x="0" y="229">Афанасьевича Антропова (04.02.1911); 6) Брак Евдокии Ивановны Дудиной (06.02.1911); 7) Рождение Нины у</text>
					<text id="t42" class="s8" x="0" y="247">Дмитрия Павловича Тараканова (29.07.1911); 8) Рождение Параскевы у Стефана Ивановича Савиных</text>

navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else a[i].addEventListener('click', jumpTo);
}
a = undefined;

window.addEventListener('DOMContentLoaded', function (){ window.parent.postMessage({event_id: 'gheight', data: document.body.scrollHeight}, '*');});

					<text id="t1" class="s6" x="0" y="16">(Около 1891 – ?)</text>

				<g id="g3" transform="translate(0,55)">
					<text id="t2" class="s8" x="0" y="13">Крестьянин д. Сетовой, род. ок. 1891 г. (в браке 22.05.1911 ему 20 лет, брак № 19, л. 235, скан p0239). Родной</text>
					<text id="t3" class="s8" x="0" y="31">брат бабы Ани Савиных. Венчался с девицей Агриппиной Трофимовной Орловой. Поручители: Гавриил</text>
					<text id="t4" class="s8" x="0" y="49">Борчанинов, Григорий Нетесов, Феодор Желнинков, солдат Иоанн Черепанов.</text>

						<text id="t12" class="s9 po" x="50" y="49" data-link="p30.html">Савиных (Бабушкина) Мария Ивановна (Около 1897 – ?)</text>

					<text id="t41" class="s8" x="0" y="13">Источники:</text>
					<text id="t42" class="s8" x="0" y="31">1.</text>
					<text id="t43" class="s8" x="14" y="31">Метрическая книга Свято-Троицкой церкви с. Станового за 1911 год</text>
					<text id="t44" class="s8" x="429" y="31">. Тип: Книга или рукопись. 100%</text>
					<text id="t45" class="s8" x="0" y="49">сплошная вычитка всех трех частей: рождений (37 сканов, июль-декабрь лл. 207-229), браков (100% всех 22</text>
					<text id="t46" class="s8" x="0" y="67">браков года, лл. 230-237), умерших (январь-март, лл. 238-242). Ключевые находки Класса А: 1) Венчание</text>
					<text id="t47" class="s8" x="0" y="85">Игнатия Меркурьевича Стрункина (06.02.1911, брак № 14) с Марией Ильиничной Шубиной, поручитель родной</text>
					<text id="t48" class="s8" x="0" y="103">брат Феодор Меркурьевич Стрункин; 2) Рождение Анны (11.11.1911, зап. 155 ж.) у Ивана Меркурьевича</text>
					<text id="t49" class="s8" x="0" y="121">Стрункина и Клавдии Артемьевой, восприемники — Василий Меркурьевич Стрункин (11 лет) и Мария</text>
					<text id="t50" class="s8" x="0" y="139">Павловна Тараканова; 3) Восприемник Игнатий Меркурьевич Стрункин (20.11.1911); 4) Венчание Ивана</text>
					<text id="t51" class="s8" x="0" y="157">Ивановича Савиных и Агриппины Трофимовны Орловой (22.05.1911, брак № 19); 5) Брак Гавриила</text>
					<text id="t52" class="s8" x="0" y="175">Афанасьевича Антропова (04.02.1911); 6) Брак Евдокии Ивановны Дудиной (06.02.1911); 7) Рождение Нины у</text>
					<text id="t53" class="s8" x="0" y="193">Дмитрия Павловича Тараканова (29.07.1911); 8) Рождение Параскевы у Стефана Ивановича Савиных</text>
					<text id="t54" class="s8" x="0" y="211">(27.10.1911).</text>

navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else a[i].addEventListener('click', jumpTo);
}
a = undefined;

window.parent.postMessage({event_id: 'gmsg', data: 'g575'}, '*');
window.addEventListener('keydown', function(e){ if( (e.keyCode && e.keyCode === 27) || ( e.code && e.code === "Escape") ) window.parent.postMessage({event_id: 'gclose', data: 'close'}, '*'); }, false );
window.addEventListener('DOMContentLoaded', function (){ window.parent.postMessage({event_id: 'gheight', data: document.body.scrollHeight}, '*');});
